<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Settings</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<header class="topbar">

    <div>

        <h2>Admin Module</h2>

        <span>
            Office Rules & Settings
        </span>

    </div>


    <button
        onclick="logout()"
        class="logout-btn">

        Logout

    </button>

</header>


<main class="container">


    <a href="dashboard.html"
       class="back-link">

        ← Dashboard

    </a>


    <div class="form-box wide">


        <h1>Office Working Rules</h1>


        <p class="subtitle">

            These settings are stored
            locally on this device.

        </p>


        <form id="settingsForm">


            <label for="startTime">

                Normal Working Start Time

            </label>

            <input
                type="time"
                id="startTime"
            >


            <label for="endTime">

                Normal Working End Time

            </label>

            <input
                type="time"
                id="endTime"
            >


            <label for="normalHours">

                Normal Working Hours

            </label>

            <input
                type="number"
                id="normalHours"
                min="0"
                step="0.5"
                placeholder="Example: 8"
            >


            <h3>
                Working Days
            </h3>


            <div class="days-grid">


                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Monday"
                    >

                    Monday

                </label>


                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Tuesday"
                    >

                    Tuesday

                </label>


                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Wednesday"
                    >

                    Wednesday

                </label>


                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Thursday"
                    >

                    Thursday

                </label>


                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Friday"
                    >

                    Friday

                </label>


                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Saturday"
                    >

                    Saturday

                </label>


                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Sunday"
                    >

                    Sunday

                </label>


            </div>


            <button
                type="submit"
                class="primary-btn">

                💾 Save Office Settings

            </button>


        </form>


    </div>


</main>


<script src="js/db.js"></script>

<script src="js/admin.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Module - Office OT Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header class="topbar">

    <div>

        <h2>
            Office OT Register
        </h2>

        <span>
            Admin Module
        </span>

    </div>


    <button
        type="button"
        onclick="logout()"
        class="logout-btn">

        Logout

    </button>

</header>



<main class="container">


    <a
        href="dashboard.html"
        class="back-link">

        ← Dashboard

    </a>



    <div class="form-box wide">


        <h1>
            Office Settings
        </h1>


        <p class="subtitle">

            Set the normal working hours
            and working days for the office.

        </p>



        <form id="settingsForm">


            <!-- START TIME -->

            <label for="startTime">

                Normal Working Start Time

            </label>


            <input
                type="time"
                id="startTime"
                required
            >



            <!-- END TIME -->

            <label for="endTime">

                Normal Working End Time

            </label>


            <input
                type="time"
                id="endTime"
                required
            >



            <!-- NORMAL HOURS -->

            <label for="normalHours">

                Normal Working Hours

            </label>


            <input
                type="number"
                id="normalHours"
                min="0"
                step="0.5"
                placeholder="Example: 8"
                required
            >



            <!-- MONTH -->

            <label for="selectedMonth">

                Current Working Month

            </label>


            <input
                type="month"
                id="selectedMonth"
                required
            >



            <!-- WORKING DAYS -->

            <h3 class="settings-heading">

                Working Days

            </h3>


            <div class="days-grid">


                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Monday"
                    >

                    Monday

                </label>



                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Tuesday"
                    >

                    Tuesday

                </label>



                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Wednesday"
                    >

                    Wednesday

                </label>



                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Thursday"
                    >

                    Thursday

                </label>



                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Friday"
                    >

                    Friday

                </label>



                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Saturday"
                    >

                    Saturday

                </label>



                <label class="check-label">

                    <input
                        type="checkbox"
                        class="workingDay"
                        value="Sunday"
                    >

                    Sunday

                </label>


            </div>



            <!-- SAVE -->

            <button
                type="submit"
                class="primary-btn">

                💾 Save Office Settings

            </button>


        </form>


    </div>



    <!-- CURRENT SETTINGS -->

    <div class="summary-box">


        <h2>
            Current Settings
        </h2>


        <div
            id="currentSettings"
            class="settings-display">

            No settings saved yet.

        </div>


    </div>


</main>



<script src="js/db.js"></script>

<script src="js/auth.js"></script>

<script src="js/admin.js"></script>


</body>

</html>

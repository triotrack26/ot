<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Settings</title>

<link rel="stylesheet"
      href="css/style.css">

</head>

<body>

<header class="topbar">

<h1>Admin Settings</h1>

</header>

<div class="container">

<a href="index.html">
← Dashboard
</a>

<h2>Working Hour Settings</h2>

<form id="settingsForm">

<label>
Normal Working Start
</label>

<input
type="time"
id="startTime"
required
>


<label>
Normal Working End
</label>

<input
type="time"
id="endTime"
required
>


<label>
Normal Working Hours
</label>

<input
type="number"
id="normalHours"
step="0.5"
min="0"
required
>


<h3>Working Days</h3>

<label>
<input
type="checkbox"
value="Monday"
class="workingDay"
>
Monday
</label>

<label>
<input
type="checkbox"
value="Tuesday"
class="workingDay"
>
Tuesday
</label>

<label>
<input
type="checkbox"
value="Wednesday"
class="workingDay"
>
Wednesday
</label>

<label>
<input
type="checkbox"
value="Thursday"
class="workingDay"
>
Thursday
</label>

<label>
<input
type="checkbox"
value="Friday"
class="workingDay"
>
Friday
</label>

<label>
<input
type="checkbox"
value="Saturday"
class="workingDay"
>
Saturday
</label>

<label>
<input
type="checkbox"
value="Sunday"
class="workingDay"
>
Sunday
</label>

<br>

<button type="submit">
Save Settings
</button>

</form>

<p id="message"></p>

</div>

<script src="js/db.js"></script>

<script>

async function loadSettings() {

    const settings =
        await getSetting("officeSettings");

    if (!settings) {

        return;
    }

    document.getElementById(
        "startTime"
    ).value = settings.startTime || "";

    document.getElementById(
        "endTime"
    ).value = settings.endTime || "";

    document.getElementById(
        "normalHours"
    ).value = settings.normalHours || "";

    document
        .querySelectorAll(".workingDay")
        .forEach(checkbox => {

            checkbox.checked =
                settings.workingDays
                ?.includes(
                    checkbox.value
                ) || false;

        });
}


document
.getElementById("settingsForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const workingDays = [];

        document
        .querySelectorAll(".workingDay")
        .forEach(checkbox => {

            if (checkbox.checked) {

                workingDays.push(
                    checkbox.value
                );

            }

        });


        const settings = {

            startTime:
                document.getElementById(
                    "startTime"
                ).value,

            endTime:
                document.getElementById(
                    "endTime"
                ).value,

            normalHours:
                Number(
                    document.getElementById(
                        "normalHours"
                    ).value
                ),

            workingDays:
                workingDays
        };


        await saveSetting(
            "officeSettings",
            settings
        );


        document.getElementById(
            "message"
        ).textContent =
            "Settings saved successfully.";

    }
);


loadSettings();

</script>

</body>

</html>

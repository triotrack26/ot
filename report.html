<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Monthly Report - Office OT Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header class="topbar">

    <div>

        <h2>
            Office OT Register
        </h2>

        <span>
            Monthly OT Report
        </span>

    </div>


    <button
        type="button"
        onclick="logout()"
        class="logout-btn">

        Logout

    </button>

</header>



<main class="container">


    <a
        href="dashboard.html"
        class="back-link">

        ← Dashboard

    </a>



    <!-- REPORT CONTROLS -->

    <div class="report-controls">


        <div>

            <label for="month">

                Select Month

            </label>


            <input
                type="month"
                id="month"
            >

        </div>



        <button
            type="button"
            onclick="loadMonthlyReport()"
            class="secondary-btn">

            🔍 View Report

        </button>



        <button
            type="button"
            onclick="downloadExcel()"
            class="primary-btn">

            📥 Download Excel

        </button>


    </div>



    <!-- EMPLOYEE INFORMATION -->

    <div class="summary-box">


        <h2>
            Employee
        </h2>


        <p>

            <strong>
                Name:
            </strong>

            <span id="reportEmployeeName">
                -
            </span>

        </p>


        <p>

            <strong>
                Employee ID:
            </strong>

            <span id="reportEmployeeId">
                -
            </span>

        </p>


    </div>



    <!-- SUMMARY -->

    <div class="summary-box">


        <h2>
            Monthly Summary
        </h2>


        <div class="summary-items">


            <div>

                <span>
                    Total OT
                </span>

                <strong>

                    <span id="totalOT">
                        0
                    </span>

                    hrs

                </strong>

            </div>



            <div>

                <span>
                    Total Extra Duty
                </span>

                <strong>

                    <span id="totalExtra">
                        0
                    </span>

                    hrs

                </strong>

            </div>



            <div>

                <span>
                    Total Records
                </span>

                <strong>

                    <span id="totalRecords">
                        0
                    </span>

                </strong>

            </div>


        </div>


    </div>



    <!-- REPORT TABLE -->

    <div class="table-box">


        <h2>
            Monthly Records
        </h2>


        <div class="table-scroll">


            <table id="reportTableElement">


                <thead>

                    <tr>

                        <th>
                            Date
                        </th>

                        <th>
                            Employee ID
                        </th>

                        <th>
                            Employee Name
                        </th>

                        <th>
                            OT Hours
                        </th>

                        <th>
                            Extra Duty
                        </th>

                        <th>
                            Extra Hours
                        </th>

                        <th>
                            Remarks
                        </th>

                    </tr>

                </thead>


                <tbody id="reportTable">

                    <tr>

                        <td
                            colspan="7"
                            style="text-align:center;">

                            Select a month
                            to view records.

                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </div>


</main>



<script src="js/db.js"></script>

<script src="js/auth.js"></script>

<script src="js/report.js"></script>


</body>

</html>

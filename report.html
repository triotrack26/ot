<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Monthly Report</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<header class="topbar">

    <div>

        <h2>Monthly Report</h2>

        <span>
            OT & Extra Duty Report
        </span>

    </div>


    <button
        onclick="logout()"
        class="logout-btn">

        Logout

    </button>

</header>


<main class="container">


    <a href="dashboard.html"
       class="back-link">

        ← Dashboard

    </a>


    <div class="report-controls">


        <div>

            <label for="month">
                Select Month
            </label>

            <input
                type="month"
                id="month"
            >

        </div>


        <button
            onclick="loadMonthlyReport()"
            class="secondary-btn">

            🔍 View Report

        </button>


        <button
            onclick="downloadExcel()"
            class="primary-btn">

            📥 Download Excel

        </button>


    </div>


    <div class="summary-box">


        <h2>Monthly Summary</h2>


        <div class="summary-items">


            <div>

                <span>
                    Total OT
                </span>

                <strong>

                    <span id="totalOT">
                        0
                    </span>

                    hrs

                </strong>

            </div>


            <div>

                <span>
                    Total Extra Duty
                </span>

                <strong>

                    <span id="totalExtra">
                        0
                    </span>

                    hrs

                </strong>

            </div>


        </div>

    </div>


    <div class="table-box">


        <h2>
            Monthly Records
        </h2>


        <div class="table-scroll">


            <table>


                <thead>

                    <tr>

                        <th>Date</th>

                        <th>OT Hours</th>

                        <th>Extra Duty</th>

                        <th>Extra Hours</th>

                        <th>Remarks</th>

                    </tr>

                </thead>


                <tbody id="reportTable">

                </tbody>


            </table>


        </div>


    </div>


</main>


<script src="js/db.js"></script>

<script src="js/auth.js"></script>

<script src="js/report.js"></script>


</body>

</html>

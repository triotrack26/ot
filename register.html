<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Registration</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<div class="form-box">


    <div class="logo small-logo">
        OT
    </div>


    <h1>
        Employee Registration
    </h1>


    <p class="subtitle">
        Register your employee details
        on this device.
    </p>


    <form id="registerForm">


        <!-- EMPLOYEE ID -->

        <label for="employeeId">

            Employee ID *

        </label>


        <input
            type="text"
            id="employeeId"
            placeholder="Example: EMP001"
            autocomplete="off"
            required
        >


        <!-- EMPLOYEE NAME -->

        <label for="employeeName">

            Employee Name *

        </label>


        <input
            type="text"
            id="employeeName"
            placeholder="Enter employee name"
            autocomplete="name"
            required
        >


        <!-- DEPARTMENT -->

        <label for="department">

            Department

        </label>


        <input
            type="text"
            id="department"
            placeholder="Example: IT"
            autocomplete="organization"
        >


        <!-- DESIGNATION -->

        <label for="designation">

            Designation

        </label>


        <input
            type="text"
            id="designation"
            placeholder="Example: IT Support"
        >


        <!-- PIN -->

        <label for="pin">

            Create PIN *

        </label>


        <input
            type="password"
            id="pin"
            placeholder="4 to 8 digit PIN"
            minlength="4"
            maxlength="8"
            inputmode="numeric"
            required
        >


        <!-- CONFIRM PIN -->

        <label for="confirmPin">

            Confirm PIN *

        </label>


        <input
            type="password"
            id="confirmPin"
            placeholder="Re-enter PIN"
            minlength="4"
            maxlength="8"
            inputmode="numeric"
            required
        >


        <!-- REGISTER -->

        <button
            type="submit"
            class="primary-btn">

            Register Employee

        </button>


    </form>


    <div class="bottom-link">

        Already registered?

        <a href="login.html">
            Login
        </a>

    </div>


    <a href="index.html"
       class="back-link">

        ← Back to Home

    </a>


</div>


<!-- DATABASE -->

<script src="js/db.js"></script>

<!-- AUTH -->

<script src="js/auth.js"></script>


</body>

</html>

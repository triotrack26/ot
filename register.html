<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Registration</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<div class="form-box">

    <h1>Employee Registration</h1>

    <p class="subtitle">
        Register this device for an employee
    </p>


    <form id="registerForm">


        <label for="employeeId">
            Employee ID *
        </label>

        <input
            type="text"
            id="employeeId"
            placeholder="Example: EMP001"
            required
        >


        <label for="employeeName">
            Employee Name *
        </label>

        <input
            type="text"
            id="employeeName"
            placeholder="Enter employee name"
            required
        >


        <label for="department">
            Department
        </label>

        <input
            type="text"
            id="department"
            placeholder="Example: IT"
        >


        <label for="designation">
            Designation
        </label>

        <input
            type="text"
            id="designation"
            placeholder="Example: Technician"
        >


        <label for="pin">
            Create PIN *
        </label>

        <input
            type="password"
            id="pin"
            placeholder="4-8 digit PIN"
            minlength="4"
            maxlength="8"
            required
        >


        <button
            type="submit"
            class="primary-btn">

            Register Device

        </button>


    </form>


    <div class="bottom-link">

        Already registered?

        <a href="login.html">
            Login
        </a>

    </div>


    <a href="index.html"
       class="back-link">

        ← Back to Home

    </a>

</div>


<script src="js/db.js"></script>

<script src="js/auth.js"></script>


</body>

</html>

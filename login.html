<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<div class="login-box">

    <div class="logo">
        OT
    </div>


    <h1>Employee Login</h1>

    <p class="subtitle">
        Login to your local OT register
    </p>


    <form id="loginForm">


        <label for="employeeId">
            Employee ID
        </label>

        <input
            type="text"
            id="employeeId"
            placeholder="Example: EMP001"
            required
        >


        <label for="pin">
            PIN
        </label>

        <input
            type="password"
            id="pin"
            placeholder="Enter your PIN"
            required
        >


        <button
            type="submit"
            class="primary-btn">

            Login

        </button>


    </form>


    <div class="bottom-link">

        First time using this device?

        <a href="register.html">
            Register
        </a>

    </div>


    <a href="index.html"
       class="back-link">

        ← Back to Home

    </a>

</div>


<script src="js/db.js"></script>

<script src="js/auth.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OT History</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<header class="topbar">

    <div>

        <h2>OT History</h2>

        <span>
            Previous Records
        </span>

    </div>


    <button
        onclick="logout()"
        class="logout-btn">

        Logout

    </button>

</header>


<main class="container">


    <a href="dashboard.html"
       class="back-link">

        ← Dashboard

    </a>


    <div class="summary-box">

        <h2>My OT Summary</h2>


        <div class="summary-items">


            <div>

                <span>
                    Total OT
                </span>

                <strong>

                    <span id="historyTotalOT">
                        0
                    </span>

                    hrs

                </strong>

            </div>


            <div>

                <span>
                    Total Extra Duty
                </span>

                <strong>

                    <span id="historyTotalExtra">
                        0
                    </span>

                    hrs

                </strong>

            </div>


        </div>

    </div>


    <div class="table-box">

        <h2>All Records</h2>


        <div class="table-scroll">

            <table>

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>OT Hours</th>

                        <th>Extra Duty</th>

                        <th>Extra Hours</th>

                        <th>Remarks</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="historyTable">

                </tbody>

            </table>

        </div>

    </div>


</main>


<script src="js/db.js"></script>

<script src="js/auth.js"></script>

<script src="js/history.js"></script>


</body>

</html>
